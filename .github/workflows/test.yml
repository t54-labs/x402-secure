name: CI

on:
  push:
    branches: [ main, develop, "x-402-*" ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Ruff lint
        run: uvx ruff@0.8.4 check .

      - name: Ruff format check
        run: uvx ruff@0.8.4 format --check .

  test:
    name: Test Suite (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # Installs from the committed uv.lock so CI resolves the same
      # dependency set as `uv sync` in the README quickstart, and installs
      # x402_proxy / x402_secure_client so the tests can import them.
      - name: Install dependencies
        run: uv sync --locked --python ${{ matrix.python-version }}

      # Bare `pytest` picks up pytest.ini: the whole tests/ tree, correct
      # coverage paths, and --cov-fail-under=30.
      - name: Run unit tests
        run: uv run --python ${{ matrix.python-version }} pytest

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-py${{ matrix.python-version }}
          path: |
            test-results/
            coverage.xml

  docker:
    name: Docker Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run Docker integration tests
        run: ./scripts/test_docker.sh
