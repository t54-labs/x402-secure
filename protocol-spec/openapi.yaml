openapi: 3.0.3
info:
  title: x402 Facilitator Proxy - Unified Gateway API
  version: 1.0.0
  description: |
    Unified gateway providing buyer risk APIs and seller x402 proxy functionality.
    This proxy integrates with Trustline risk engine for AI agent payment protection.

    Developed by t54 labs (https://t54.ai)
  contact:
    name: t54 labs
    email: dev@t54.ai
    url: https://t54.ai
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
servers:
  - url: <X402_SECURE_PROXY_URL>
    description: Hosted or self-hosted x402-secure proxy
  - url: http://localhost:8000
    description: Local development server
tags:
  - name: Risk Management
    description: AI agent risk session and trace management endpoints
  - name: x402 Proxy
    description: Payment verification and settlement proxy endpoints
  - name: Internal
    description: Hosted-facilitator endpoints; require an internal bearer token
  - name: Health
    description: Liveness check
paths:
  /health:
    get:
      summary: Liveness check
      operationId: health
      tags:
        - Health
      responses:
        '200':
          description: Proxy is running
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [ok] }

  /risk/session:
    post:
      summary: Create risk session
      operationId: createRiskSession
      description: |
        Create a new risk session for an AI agent. This session will be used to track
        agent behavior and make risk decisions through Trustline's logic-level assessment.

        Both agent_did and wallet_address are required:
        - agent_did: Agent DID (current phase often same as wallet; future: did:eip8004:...)
        - wallet_address: EVM wallet address (0x...) - current phase; future: multi-chain
        - agent_endpoint: Optional agent callback/base URL
      tags:
        - Risk Management
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agent_did, wallet_address]
              properties:
                agent_did:
                  type: string
                  description: Agent DID (currently often same as wallet address; future DID formats)
                wallet_address:
                  type: string
                  pattern: '^0x.{40}$'
                  description: EVM wallet address (0x followed by 40 characters); invalid values return 422
                agent_endpoint:
                  type: string
                  nullable: true
                  description: Optional agent callback/base URL
                app_id:
                  type: string
                  nullable: true
                device:
                  type: object
                  additionalProperties: true
                  nullable: true
      responses:
        '200':
          description: Session created
          content:
            application/json:
              schema:
                type: object
                required: [sid, expires_at]
                properties:
                  sid: { type: string, format: uuid }
                  expires_at: { type: string, format: date-time }
        '4XX': { $ref: '#/components/responses/Error' }
        '5XX': { $ref: '#/components/responses/Error' }

  /risk/trace:
    post:
      summary: Store agent trace for a session
      operationId: createRiskTrace
      description: |
        Store comprehensive agent execution trace including reasoning chains, tool calls,
        and runtime behavior. This data is used by Trustline for logic-level risk assessment
        and evidence-based validation.

        agent_trace is optional at the proxy, which does not validate its fields. Send the
        AgentTraceData fields you have; the risk engine may reject or down-score incomplete traces.
      tags:
        - Risk Management
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sid]
              properties:
                sid:
                  type: string
                  format: uuid
                  description: Session ID from /risk/session
                fingerprint:
                  type: object
                  additionalProperties: true
                  nullable: true
                  description: Browser/device fingerprint (optional)
                telemetry:
                  type: object
                  additionalProperties: true
                  nullable: true
                  description: Additional telemetry data (optional)
                agent_trace:
                  nullable: true
                  allOf:
                    - $ref: '#/components/schemas/AgentTraceData'
      responses:
        '200':
          description: Trace stored
          content:
            application/json:
              schema:
                type: object
                required: [tid]
                properties:
                  tid: { type: string, format: uuid }
        '4XX': { $ref: '#/components/responses/Error' }
        '5XX': { $ref: '#/components/responses/Error' }

  /risk/trace/{tid}:
    get:
      summary: Query stored agent trace by trace ID
      operationId: getRiskTrace
      description: |
        Local mode only (PROXY_LOCAL_RISK=1). Returns 501 when the proxy forwards to a risk
        engine. Requires no authentication.
      tags:
        - Risk Management
      parameters:
        - in: path
          name: tid
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Agent trace data
          content:
            application/json:
              schema:
                type: object
                required: [sid]
                properties:
                  sid:
                    type: string
                    format: uuid
                  fingerprint:
                    type: object
                    additionalProperties: true
                    nullable: true
                  telemetry:
                    type: object
                    additionalProperties: true
                    nullable: true
                  agent_trace:
                    nullable: true
                    allOf:
                      - $ref: '#/components/schemas/AgentTraceData'
        '404':
          description: Trace not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: object }
        '501':
          description: Not available in forward mode
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HTTPError' }
        '4XX': { $ref: '#/components/responses/Error' }
        '5XX': { $ref: '#/components/responses/Error' }

  /risk/evaluate:
    post:
      summary: Evaluate payment risk
      operationId: evaluateRisk
      description: |
        Evaluates risk for a session/trace/payment. The proxy calls it during /x402/verify
        (and /x402/settle when PROXY_SETTLE_RISK_ENABLED=1). The route is mounted on the
        gateway and requires no authentication. With PROXY_LOCAL_RISK=1 it returns a local
        decision; with PROXY_LOCAL_RISK=0 it forwards to RISK_ENGINE_URL. A decision obtained
        here does not authorize settlement; only /x402/verify issues X-PAYMENT-AUTHORIZATION.
      tags:
        - Risk Management
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sid, trace_context, payment]
              properties:
                sid: { type: string, format: uuid }
                tid: { type: string, format: uuid, nullable: true }
                trace_context:
                  type: object
                  required: [tp]
                  properties:
                    tp: { type: string, description: W3C traceparent }
                    ts: { type: string, description: ts value from X-PAYMENT-SECURE, nullable: true }
                mandate:
                  type: object
                  nullable: true
                  required: [ref, sha256_b64url, mime, size]
                  properties:
                    ref: { type: string }
                    sha256_b64url: { type: string }
                    mime: { type: string }
                    size: { type: integer }
                payment:
                  $ref: '#/components/schemas/PaymentContext'
      responses:
        '200':
          description: Risk evaluation decision
          content:
            application/json:
              schema:
                type: object
                required: [decision, decision_id]
                properties:
                  decision: { type: string, enum: [allow, deny, review] }
                  decision_id: { type: string }
                  ttl_seconds: { type: integer, default: 300 }
                  reasons: { type: array, items: { type: string } }
                  risk_level: { type: string, enum: [high, medium, low], default: low }
                  used_mandate: { type: boolean, default: false }
                  warnings: { type: array, items: { type: string } }
                  extra: { type: object, additionalProperties: true }
        '4XX': { $ref: '#/components/responses/Error' }
        '5XX': { $ref: '#/components/responses/Error' }

  /internal/x402-secure/facilitator/evaluate:
    post:
      summary: Evaluate an XRPL Facilitator payment through Trustline fast VI-chain verification
      operationId: evaluateInternalFacilitatorPayment
      description: |
        Internal endpoint used by the T54-hosted XRPL x402 Facilitator. The Facilitator
        sends the normalized XRPL payment context plus `extensions.x402Secure`. This
        endpoint preserves `verifiableIntentChain` bytes, computes XRPL binding context,
        and calls Trustline's fast `verifiable-intent/verify-chain` path.

        This endpoint is not used by the Base/Solana Paid API and is not a public
        x402 seller integration surface. If no `x402Secure` extension is present, the
        XRPL Facilitator should bypass this endpoint entirely.
      tags:
        - Internal
      security:
        - InternalBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InternalFacilitatorEvaluateRequest'
      responses:
        '200':
          description: Gating decision for the Facilitator settle path
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalFacilitatorDecisionResponse'
        '401': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '503':
          description: Trustline verification is temporarily unavailable; no allow or settle occurred
          headers:
            Retry-After:
              schema: { type: integer, default: 30 }
            X-Correlation-ID:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrustlineTransientResponse'
        '5XX': { $ref: '#/components/responses/Error' }

  /internal/x402-secure/facilitator/evidence-session:
    post:
      summary: Create a Trustline evidence session for legacy VI references
      operationId: createInternalFacilitatorEvidenceSession
      description: |
        Internal helper for the legacy evidence-session flow. Inline L1-L3
        `verifiableIntentChain` payments do not need this handshake.
      tags:
        - Internal
      security:
        - InternalBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InternalEvidenceSessionRequest'
      responses:
        '200':
          description: Trustline evidence session response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401': { $ref: '#/components/responses/Error' }
        '403':
          description: Token valid but the action, or a request selector (organization, environment, policy), is outside its service scope
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HTTPError' }
        '503':
          description: Internal service registry misconfigured, or Trustline unavailable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HTTPError' }
        '5XX': { $ref: '#/components/responses/Error' }

  /internal/x402-secure/facilitator/evidence:
    post:
      summary: Upload or record Facilitator evidence for a Trustline session
      operationId: recordInternalFacilitatorEvidence
      tags:
        - Internal
      security:
        - InternalBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InternalEvidenceUploadRequest'
      responses:
        '200':
          description: Trustline evidence record response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401': { $ref: '#/components/responses/Error' }
        '403':
          description: Token valid but the action, or a request selector (organization, environment, policy), is outside its service scope
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HTTPError' }
        '503':
          description: Internal service registry misconfigured, or Trustline unavailable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HTTPError' }
        '5XX': { $ref: '#/components/responses/Error' }

  /internal/x402-secure/facilitator/receipt:
    post:
      summary: Record Facilitator settlement receipt metadata in Trustline
      operationId: recordInternalFacilitatorReceipt
      tags:
        - Internal
      security:
        - InternalBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InternalReceiptRequest'
      responses:
        '200':
          description: Trustline receipt response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401': { $ref: '#/components/responses/Error' }
        '403':
          description: Token valid but the action, or a request selector (organization, environment, policy), is outside its service scope
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HTTPError' }
        '503':
          description: Internal service registry misconfigured, or Trustline unavailable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HTTPError' }
        '5XX': { $ref: '#/components/responses/Error' }

  /internal/x402-secure/facilitator/vi-receipts/lookup:
    post:
      summary: Look up stored VI receipt status for settled transactions
      operationId: lookupInternalFacilitatorViReceipts
      description: Requires a token granted the receipt_lookup action.
      tags:
        - Internal
      security:
        - InternalBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                transactions:
                  type: array
                  items:
                    type: object
                    properties:
                      hash: { type: string, nullable: true }
                      transactionHash: { type: string, nullable: true }
                      invoiceId: { type: string, nullable: true }
                      rawMemo: { type: string, nullable: true }
      responses:
        '200':
          description: Receipts found in the caller's service scope
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { type: object, additionalProperties: true } }
        '401':
          description: Missing or invalid internal token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HTTPError' }
        '403':
          description: Token valid but receipt_lookup is outside its service scope
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HTTPError' }
        '503':
          description: No shared receipt store is configured or reachable, or the service registry is misconfigured
          headers:
            Retry-After: { schema: { type: integer } }
          content:
            application/json:
              schema:
                type: object
                properties:
                  reason: { type: string, enum: [vi_receipt_store_unavailable] }
                  retryable: { type: boolean }
                  detail: { type: string }

  /x402/verify:
    post:
      summary: Verify payment with risk gating then forward to upstream facilitator
      operationId: proxyVerify
      description: |
        Verify x402 payment with Trustline risk assessment before forwarding to upstream facilitator.
        Supports AP2 integration through X-AP2-EVIDENCE header for enhanced agent payment protection.
        Risk decisions are made based on agent behavior, mandate compliance, and logic-level analysis.
        Returns 503 when the proxy is misconfigured (missing PROXY_PAYMENT_AUTHORIZATION_KEY or
        invalid PROXY_PUBLIC_MERCHANT_POLICY_JSON).
      tags:
        - x402 Proxy
      parameters:
        - in: header
          name: X-PAYMENT
          required: false
          description: When present, must decode to the same JSON as paymentPayload (else 422); more than one is rejected.
          schema: { type: string }
        - in: header
          name: X-PAYMENT-SECURE
          required: true
          description: Missing or invalid → 400 TRACE_HEADER_INVALID.
          schema: { type: string, description: "w3c.v1;tp=<traceparent>[;ts=<url-encoded value>]" }
        - in: header
          name: X-RISK-SESSION
          required: true
          schema: { type: string, format: uuid }
        - in: header
          name: X-AP2-EVIDENCE
          required: false
          description: Mandate reference (evd.v1;...) or, when the value does not start with "evd.v1;", base64 signed AP2 evidence JSON.
          schema: { type: string, description: evd.v1;mr=<ref>;ms=<sha256b64url>;mt=application/json;sz=<bytes> }
        - in: header
          name: Origin
          required: false
          description: When present, must equal the origin of paymentRequirements.resource for AP2 evidence.
          schema: { type: string }
        - in: header
          name: X-RISK-TRACE
          required: false
          description: tid from /risk/trace (UUID v1 or v4). If absent, the proxy reads tid from the ts field of X-PAYMENT-SECURE.
          schema: { type: string, format: uuid }
        - in: header
          name: X-VERIFIABLE-INTENT
          required: false
          schema: { type: string, maxLength: 4096, description: "vi.v1;ref=<ref>;sha256=sha256:<hex>;mt=<media-type>;sz=<bytes>" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [x402Version, paymentPayload, paymentRequirements]
              additionalProperties: true
              description: |
                paymentPayload.x402Version must equal x402Version, and paymentPayload.scheme/network
                must match paymentRequirements.
              properties:
                x402Version: { type: integer, enum: [1] }
                paymentPayload: { type: object }
                paymentRequirements: { type: object }
                ap2EvidenceHeader: { type: string, description: base64(JSON signed AP2 evidence) if not sent in X-AP2-EVIDENCE }
                verifiableIntent: { type: object, additionalProperties: true, description: Inline Verifiable Intent evidence or reference metadata }
                ap2Context: { type: object, additionalProperties: true, description: AP2 mandate references or inline mandate context }
                traceContext: { type: object, additionalProperties: true, description: Agent trace context supplied by SDKs or facilitators }
                viPolicy: { type: object, additionalProperties: true, description: Per-request Verifiable Intent policy overrides }
                policy: { type: object, additionalProperties: true, description: Generic policy object accepted for facilitator compatibility }
      responses:
        '200':
          description: Upstream facilitator response (normalized)
          content:
            application/json:
              schema:
                type: object
                required: [isValid, payer]
                properties:
                  isValid: { type: boolean }
                  payer: { type: string }
                  invalidReason: { type: string, nullable: true }
          headers:
            X-PAYMENT-AUTHORIZATION:
              description: Present only when isValid is true. Pass unchanged to /x402/settle.
              schema: { type: string }
            X-Request-ID: { schema: { type: string } }
            X-Risk-Decision: { schema: { type: string, enum: [allow] } }
            X-Risk-Decision-ID: { schema: { type: string } }
            X-Risk-TTL-Seconds: { schema: { type: integer } }
            X-VI-Decision: { schema: { type: string, enum: [allow] } }
            X-VI-Decision-ID: { schema: { type: string } }
            X-VI-Verified: { schema: { type: string, enum: ["true", "false"] } }
            X-VI-Evidence-Ref: { schema: { type: string } }
        '503': { $ref: '#/components/responses/Error' }
        '4XX': { $ref: '#/components/responses/Error' }
        '5XX': { $ref: '#/components/responses/Error' }

  /x402/settle:
    post:
      summary: Settle a payment previously allowed by /x402/verify
      operationId: proxySettle
      description: |
        Requires the X-PAYMENT-AUTHORIZATION returned by /x402/verify for the same payment,
        requirements and evidence. PROXY_SETTLE_RISK_ENABLED=1 adds a second risk evaluation.
      tags:
        - x402 Proxy
      parameters:
        - in: header
          name: X-PAYMENT-AUTHORIZATION
          required: true
          description: Token returned by /x402/verify for this exact payment. Missing, altered, expired or mismatched → 403 PAYMENT_AUTHORIZATION_REQUIRED.
          schema: { type: string, maxLength: 4096 }
        - in: header
          name: X-PAYMENT
          required: false
          description: When present, must decode to the same JSON as paymentPayload (else 422); more than one is rejected.
          schema: { type: string }
        - in: header
          name: X-PAYMENT-SECURE
          required: true
          schema: { type: string }
        - in: header
          name: X-RISK-SESSION
          required: true
          schema: { type: string, format: uuid }
        - in: header
          name: X-AP2-EVIDENCE
          required: false
          description: Mandate reference (evd.v1;...) or, when the value does not start with "evd.v1;", base64 signed AP2 evidence JSON.
          schema: { type: string }
        - in: header
          name: Origin
          required: false
          description: When present, must equal the origin of paymentRequirements.resource for AP2 evidence.
          schema: { type: string }
        - in: header
          name: X-RISK-TRACE
          required: false
          description: tid from /risk/trace (UUID v1 or v4). If absent, the proxy reads tid from the ts field of X-PAYMENT-SECURE.
          schema: { type: string, format: uuid }
        - in: header
          name: X-VERIFIABLE-INTENT
          required: false
          schema: { type: string, maxLength: 4096, description: "vi.v1;ref=<ref>;sha256=sha256:<hex>;mt=<media-type>;sz=<bytes>" }
        - in: header
          name: X-SETTLEMENT-ATTEMPT-ID
          required: false
          description: Copied into the VI receipt.
          schema: { type: string }
        - in: header
          name: X-IDEMPOTENCY-KEY
          required: false
          description: Copied into the VI receipt.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [x402Version, paymentPayload, paymentRequirements]
              additionalProperties: true
              description: |
                paymentPayload.x402Version must equal x402Version, and paymentPayload.scheme/network
                must match paymentRequirements.
              properties:
                x402Version: { type: integer, enum: [1] }
                paymentPayload: { type: object }
                paymentRequirements: { type: object }
                ap2EvidenceHeader: { type: string, description: base64(JSON signed AP2 evidence) if not sent in X-AP2-EVIDENCE }
                verifiableIntent: { type: object, additionalProperties: true, description: Inline Verifiable Intent evidence or reference metadata }
                ap2Context: { type: object, additionalProperties: true, description: AP2 mandate references or inline mandate context }
                traceContext: { type: object, additionalProperties: true, description: Agent trace context supplied by SDKs or facilitators }
                viPolicy: { type: object, additionalProperties: true, description: Per-request Verifiable Intent policy overrides }
                policy: { type: object, additionalProperties: true, description: Generic policy object accepted for facilitator compatibility }
      responses:
        '200':
          description: Upstream facilitator response (normalized)
          content:
            application/json:
              schema:
                type: object
                required: [success, payer]
                properties:
                  success: { type: boolean }
                  payer: { type: string }
                  transaction: { type: string, nullable: true }
                  network: { type: string, nullable: true }
                  errorReason: { type: string, nullable: true }
          headers:
            X-Request-ID: { schema: { type: string } }
            X-Risk-Decision: { schema: { type: string, enum: [allow] } }
            X-Risk-Decision-ID: { schema: { type: string } }
            X-Risk-TTL-Seconds: { schema: { type: integer } }
            X-VI-Decision: { schema: { type: string, enum: [allow] } }
            X-VI-Decision-ID: { schema: { type: string } }
            X-VI-Verified: { schema: { type: string, enum: ["true", "false"] } }
            X-VI-Evidence-Ref: { schema: { type: string } }
            X-VI-Receipt-Status: { schema: { type: string, enum: [recorded, failed] } }
            X-VI-Receipt-ID: { schema: { type: string } }
        '4XX': { $ref: '#/components/responses/Error' }
        '5XX': { $ref: '#/components/responses/Error' }

components:
  securitySchemes:
    InternalBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: internal-token
      description: |
        Per-service bearer token configured via X402_SECURE_INTERNAL_SERVICES_JSON (or the
        single-service X402_SECURE_INTERNAL_TOKEN). Each token is limited to a set of actions
        and an organization/environment/policy scope. The token may also be sent as X-Internal-Token.

  schemas:
    FacilitatorInfo:
      type: object
      required: [id, network]
      properties:
        id:
          type: string
          example: xrpl-x402-facilitator
        network:
          type: string
          example: xrpl
        environment:
          type: string
          nullable: true
          enum: [production, staging, test, development]

    InternalPolicy:
      type: object
      description: |
        Server-selected X402 Secure policy. `policyId` and `policyVersion` are preserved
        by x402-secure and may be used for Trustline credential routing. Client-supplied
        policy data must be overwritten or tightened by the Facilitator before this call.
      properties:
        policyId:
          type: string
          nullable: true
          example: pol_xrpl_default
        policyVersion:
          type: string
          nullable: true
          example: v1
        requireVerifiableIntent: { type: boolean, default: false }
        requireVerifiedIntent: { type: boolean, default: false }
        requirePaymentMandate: { type: boolean, default: false }
        requireHolderBinding: { type: boolean, default: false }
        requireTrace: { type: boolean, default: false }
        acceptedIssuers:
          type: array
          items: { type: string }
        reviewMode:
          type: string
          enum: [allow, block, review]
          default: block

    InternalPaymentContext:
      type: object
      description: Normalized payment context sent by the XRPL Facilitator.
      properties:
        protocol:
          type: string
          default: x402
        chain:
          type: string
          example: xrpl
        network:
          type: string
          example: xrpl:0
        asset:
          type: string
          example: XRP
        issuer:
          type: string
          nullable: true
        amount:
          oneOf:
            - type: string
            - type: number
          nullable: true
          example: "0.001"
        currency:
          type: string
          nullable: true
        destination:
          type: string
          nullable: true
          example: rMerchant
        payTo:
          type: string
          nullable: true
          example: rMerchant
        resource:
          type: string
          nullable: true
          example: https://merchant.example/resource
        merchantOrigin:
          type: string
          nullable: true
        paymentHash:
          type: string
          nullable: true
        paymentRequirementsHash:
          type: string
          nullable: true
          example: sha256:...
        payloadHash:
          type: string
          nullable: true
          example: sha256:...
        payload:
          type: object
          additionalProperties: true
          description: XRPL signed payment payload or decoded transaction context.
        paymentRequirements:
          type: object
          additionalProperties: true
          description: x402 PaymentRequirements selected by the merchant/facilitator.

    VerifiableIntentReference:
      type: object
      properties:
        format:
          type: string
          default: sd-jwt
        profile:
          type: string
          default: mastercard-vi-v0.1
        presentation:
          type: string
          nullable: true
          description: Inline VI presentation; avoid logging this value.
        presentationRef:
          type: string
          nullable: true
        presentationHash:
          type: string
          nullable: true
        claims:
          type: object
          additionalProperties: true
        constraints:
          type: object
          additionalProperties: true
        layers:
          type: object
          additionalProperties: true
        keyBinding:
          type: object
          additionalProperties: true
          nullable: true
        metadata:
          type: object
          additionalProperties: true

    VerifiableIntentChainNode:
      type: object
      description: One opaque SD-JWT layer. Preserve the string bytes exactly.
      properties:
        format:
          type: string
          nullable: true
          example: sd+jwt
        sdJwt:
          type: string
          nullable: true
          description: Full SD-JWT presentation including disclosures.
        jwt:
          type: string
          nullable: true
          description: Alternate compact JWT field accepted by Trustline's verifier.
      additionalProperties: true

    VerifiableIntentChain:
      type: object
      required: [l1Credential, l2Delegation, l3FinalAction]
      properties:
        l1Credential:
          $ref: '#/components/schemas/VerifiableIntentChainNode'
        l2Delegation:
          $ref: '#/components/schemas/VerifiableIntentChainNode'
        l3FinalAction:
          $ref: '#/components/schemas/VerifiableIntentChainNode'
      additionalProperties: true

    X402SecureExtension:
      type: object
      properties:
        version:
          type: string
          default: x402-secure.vi.v1
        mode:
          type: string
          enum: [optional, enforce]
          nullable: true
        policy:
          $ref: '#/components/schemas/InternalPolicy'
        verifiableIntent:
          $ref: '#/components/schemas/VerifiableIntentReference'
        verifiableIntentChain:
          $ref: '#/components/schemas/VerifiableIntentChain'
        ap2:
          type: object
          additionalProperties: true
          nullable: true
        trace:
          type: object
          additionalProperties: true
          nullable: true

    InternalFacilitatorEvaluateRequest:
      type: object
      required: [facilitator, payment, extensions]
      properties:
        facilitator:
          $ref: '#/components/schemas/FacilitatorInfo'
        payment:
          $ref: '#/components/schemas/InternalPaymentContext'
        extensions:
          type: object
          required: [x402Secure]
          properties:
            x402Secure:
              $ref: '#/components/schemas/X402SecureExtension'
          additionalProperties: true
        merchant:
          type: object
          additionalProperties: true
        buyer:
          type: object
          additionalProperties: true
          properties:
            walletAddress:
              type: string
              nullable: true
            agentId:
              type: string
              nullable: true
        metadata:
          type: object
          additionalProperties: true
          properties:
            developerOrgId:
              type: string
              nullable: true
              description: Server-resolved developer organization id. Used for Trustline credential routing.
            x402SecureRouteId:
              type: string
              nullable: true

    BindingProfileResult:
      type: object
      properties:
        paymentBound: { type: boolean }
        chain: { type: string, nullable: true }
        asset: { type: string, nullable: true }
        issuer: { type: string, nullable: true }
        amount: { type: string, nullable: true }
        destination: { type: string, nullable: true }
        resource: { type: string, nullable: true }
        violations:
          type: array
          items:
            type: object
            additionalProperties: true
        hashes:
          type: object
          additionalProperties:
            type: string
        canonical:
          type: object
          additionalProperties: true

    InternalFacilitatorDecisionResponse:
      type: object
      required: [decision, decision_id]
      properties:
        decision:
          type: string
          enum: [allow, deny, review]
        decision_id:
          type: string
        risk_level:
          type: string
          enum: [low, medium, high]
        ttl_seconds:
          type: integer
          default: 300
        vi:
          type: object
          additionalProperties: true
          description: Fast Trustline VI-chain result mapped into x402-secure response shape.
        binding:
          $ref: '#/components/schemas/BindingProfileResult'
        reasons:
          type: array
          items: { type: string }
        warnings:
          type: array
          items: { type: string }
        trustline_assessment:
          type: object
          additionalProperties: true

    TrustlineTransientResponse:
      type: object
      required: [reason, retryable, retryAfter, correlationId, phase, settlementAttempted]
      properties:
        reason:
          type: string
          enum: [trustline_unavailable]
        retryable:
          type: boolean
          enum: [true]
        retryAfter:
          type: integer
          default: 30
        correlationId:
          type: string
        phase:
          type: string
          enum: [verify]
        settlementAttempted:
          type: boolean
          enum: [false]

    InternalEvidenceSessionRequest:
      type: object
      properties:
        facilitator:
          $ref: '#/components/schemas/FacilitatorInfo'
        agentId: { type: string, nullable: true }
        walletAddress: { type: string, nullable: true }
        merchantId: { type: string, nullable: true }
        policy:
          $ref: '#/components/schemas/InternalPolicy'
        requiredEvidence:
          type: array
          items: { type: string }
        expiresInSeconds:
          type: integer
          default: 900
        metadata:
          type: object
          additionalProperties: true

    InternalEvidenceUploadRequest:
      type: object
      required: [sessionId, evidenceType, evidence]
      properties:
        sessionId: { type: string }
        evidenceType: { type: string }
        evidence:
          type: object
          additionalProperties: true
        sha256:
          type: string
          nullable: true
        metadata:
          type: object
          additionalProperties: true

    InternalReceiptRequest:
      type: object
      required: [decisionId]
      properties:
        decisionId: { type: string }
        evidenceRef: { type: string, nullable: true }
        settlementAttemptId: { type: string, nullable: true }
        idempotencyKey: { type: string, nullable: true }
        payment:
          type: object
          additionalProperties: true
        metadata:
          type: object
          additionalProperties: true

    HTTPError:
      type: object
      description: Default FastAPI error body
      properties:
        detail: { type: string }

    PaymentContext:
      type: object
      description: Generic payment context supporting multiple protocols
      required:
        - protocol
        - payload
      properties:
        protocol:
          type: string
          description: 'Payment protocol identifier (e.g., "eip3009", "x402:exact", "solana:transfer", "btc:psbt")'
          example: "eip3009"
        version:
          oneOf:
            - { type: string }
            - { type: integer }
          nullable: true
          description: Protocol version
        network:
          type: string
          nullable: true
          description: 'Network identifier (e.g., "base-sepolia", "solana-mainnet")'
          example: "base-sepolia"
        payload:
          type: object
          additionalProperties: true
          description: Protocol-specific payload (e.g., authorization, signature)
        headers:
          type: object
          additionalProperties:
            type: string
          nullable: true
          description: Transport/binding related headers (optional)
        extra:
          type: object
          additionalProperties: true
          nullable: true
          description: Additional metadata (optional)

    AgentTraceData:
      type: object
      description: Complete agent execution trace with all required fields
      required:
        - task
        - parameters
        - environment
        - events
        - model_config
        - session_context
        - completed_at
      properties:
        task:
          type: string
          description: 'Task description (e.g., "Buy BTC price")'
        parameters:
          type: object
          additionalProperties: true
          description: 'Task parameters (e.g., {"symbol": "BTC/USD"})'
        environment:
          type: object
          additionalProperties: true
          description: Environment configuration (e.g., network, seller URL)
        events:
          type: array
          description: List of agent events (user inputs, agent outputs, tool calls, etc.)
          items:
            type: object
            additionalProperties: true
        model_config:
          type: object
          description: LLM model configuration
          additionalProperties: true
          properties:
            provider:
              type: string
              example: "openai"
            model:
              type: string
              example: "gpt-5-mini"
            tools_enabled:
              type: array
              items:
                type: string
        session_context:
          type: object
          description: Session context information
          additionalProperties: true
          properties:
            session_id:
              type: string
              format: uuid
            request_id:
              type: string
              format: uuid
            agent_did:
              type: string
              description: Agent DID (wallet address or EIP-8004 DID)
            client_ip_hash:
              type: string
              description: SHA256 hash of client IP
        completed_at:
          type: string
          format: date-time
          description: Completion timestamp (ISO 8601)

  responses:
    Error:
      description: Error response with stable shape
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                required: [code, message]
                properties:
                  code: { type: string }
                  message: { type: string }
              request_id: { type: string }
